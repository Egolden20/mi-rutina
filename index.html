<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101722"><title>Mi rutina de gimnasio</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#0d121a;color:#f4f7fa}*{box-sizing:border-box}body{margin:0}main{max-width:780px;margin:auto;padding:22px 14px 95px}h1{font-size:clamp(25px,5vw,38px);margin:10px 0}p,small{color:#aab7c7}header{display:flex;justify-content:space-between;align-items:center}header b{color:#b4f97b;letter-spacing:2px}nav{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:22px 0}button{cursor:pointer;border:1px solid #3c4c5b;background:#1b2936;color:#fff;border-radius:12px;padding:12px 8px;font-weight:700}nav button.active,.primary{background:#b4f97b;color:#182010;border-color:#b4f97b}.hero{padding:20px;background:linear-gradient(130deg,#203b30,#182436);border:1px solid #3c6846;border-radius:19px}.hero h2{margin:8px 0}.track{height:8px;background:#344637;border-radius:8px;margin-top:16px;overflow:hidden}.bar{height:100%;background:#b4f97b;width:0}.heading{display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px}.heading h3{margin:0}.card{background:#17212e;border:1px solid #344458;border-radius:16px;padding:16px;margin:10px 0}.card.donecard{border-color:#8ad17b}.name{display:flex;gap:12px;align-items:flex-start}.num{background:#31492e;color:#b4f97b;border-radius:8px;padding:7px;font-size:12px;font-weight:800}.name strong{display:block}.name small{display:block;margin-top:5px}.columns,.series{display:grid;grid-template-columns:38px 1fr 1fr 48px;align-items:center;gap:7px;margin-top:9px;text-align:center}.columns{color:#aab7c7;font-size:11px;text-transform:uppercase;margin-top:19px}.series input,.time input,.note{min-width:0;width:100%;padding:11px 6px;background:#0e1723;border:1px solid #3d5064;border-radius:10px;color:white;text-align:center;font-size:15px}.check{width:43px;height:43px;font-size:22px}.check.on{background:#b4f97b;color:#14250b}.note{margin-top:12px;text-align:left;font-size:12px}.time{display:flex;align-items:center;gap:12px;margin:12px 0}.time input{width:105px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.actions button{flex:1}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0d121af2;border-top:1px solid #39434b;padding:12px;display:flex;justify-content:center;gap:12px}.bottom button{width:min(100%,360px)}.history{background:#17212e;border:1px solid #344458;border-radius:13px;padding:12px;margin:9px 0}.history p{font-size:12px;line-height:1.7}@media(max-width:360px){nav{gap:4px}nav button{padding:11px 2px}.card{padding:12px}.columns,.series{gap:4px;grid-template-columns:30px 1fr 1fr 44px}} 
</style></head><body><main><header><b>⚡ GYM TRACKER</b><small id="date"></small></header><h1>Mi rutina</h1><p>Lunes a viernes · Registra pesos y repeticiones por serie</p><nav id="days"></nav><section class="hero"><small id="weekday"></small><h2 id="title"></h2><p id="desc"></p><div class="track"><div class="bar" id="bar"></div></div><small id="progress"></small></section><div id="workout"></div><section id="historyArea"><div class="heading"><h3>📈 Historial</h3></div><div id="history"></div></section><div class="actions"><button id="export">⬇ Exportar respaldo</button><button id="import">⬆ Importar respaldo</button><button id="reset">Reiniciar día</button></div><input hidden type="file" id="file" accept=".json,application/json"><p style="font-size:12px">Los registros se guardan en este navegador. No se sincronizan entre celulares o navegadores. Exporta copias de seguridad periódicamente.</p></main><div class="bottom"><button id="showHistory">Ver historial</button><button class="primary" id="save">✓ Finalizar sesión</button></div>
<script>
'use strict';
const upper=[['Press de banca','Pecho'],['Remo sentado','Espalda'],['Máquina lat pull','Espalda'],['Press de hombros en máquina','Hombros'],['Curl con barra','Bíceps'],['Fondos de tríceps en máquina','Tríceps']];
const lower=[['Prensa horizontal','Piernas'],['Extensión de piernas','Cuádriceps'],['Aductores en máquina','Aductores'],['Curl femoral sentado','Femoral'],['Pantorrilla parado','Pantorrilla']];
const days=[['Lun','Lunes','Tren superior','Cardio inicial → tren superior → cardio final',upper],['Mar','Martes','Tren inferior','Cardio inicial → tren inferior → cardio final',lower],['Mié','Miércoles','Cardio y abdomen','45 minutos de cardio + abdomen',[['Abdominal en máquina','Abdomen']]],['Jue','Jueves','Tren superior','Cardio inicial → tren superior → cardio final',upper],['Vie','Viernes','Tren inferior','Cardio inicial → tren inferior → cardio final',lower]];
const key='mi-rutina-v1';let data;try{data=JSON.parse(localStorage.getItem(key))||{sessions:{},history:[]}}catch{data={sessions:{},history:[]}};data.sessions??={};data.history??=[];
let day=new Date().getDay();day=day>=1&&day<=5?day-1:0;const el=id=>document.getElementById(id);
function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch{alert('No se pudieron guardar los datos en este navegador')}}
function state(){return data.sessions[day]??={}}
function val(id,prop,fallback=''){return state()[id]?.[prop]??fallback}
function update(id,prop,value){state()[id]??={};state()[id][prop]=value;save();progress()}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cardio(id,label,minutes){return '<article class="card"><div class="name"><span class="num">⏱</span><div><strong>'+label+'</strong><small>Duración editable</small></div></div><div class="time"><span>Minutos:</span><input type="number" min="0" max="240" data-id="'+id+'" data-k="minutes" value="'+esc(val(id,'minutes',minutes))+'"><button class="check '+(val(id,'done')?'on':'')+'" data-toggle="'+id+'" data-prop="done">'+(val(id,'done')?'✓':'○')+'</button></div></article>'}
function exercise(e,i){const id='ex'+i;let out='<article class="card"><div class="name"><span class="num">'+(i+1)+'</span><div><strong>'+esc(e[0])+'</strong><small>'+esc(e[1])+' · 4 series × 15 repeticiones</small></div></div><div class="columns"><span>Serie</span><span>Reps</span><span>Peso kg</span><span>Listo</span></div>';
for(let j=1;j<=4;j++){const done=!!val(id,'done'+j);out+='<div class="series"><span>'+j+'</span><input aria-label="Repeticiones serie '+j+' '+esc(e[0])+'" type="number" min="0" data-id="'+id+'" data-k="reps'+j+'" value="'+esc(val(id,'reps'+j,15))+'"><input aria-label="Peso en kg serie '+j+' '+esc(e[0])+'" type="number" min="0" step="0.5" inputmode="decimal" placeholder="kg" data-id="'+id+'" data-k="weight'+j+'" value="'+esc(val(id,'weight'+j))+'"><button aria-label="Marcar serie '+j+'" class="check '+(done?'on':'')+'" data-toggle="'+id+'" data-prop="done'+j+'">'+(done?'✓':'○')+'</button></div>'}
return out+'<input class="note" placeholder="Notas (opcional)" data-id="'+id+'" data-k="note" value="'+esc(val(id,'note'))+'"></article>'}
function progress(){const ids=day===2?['middle']:['start','end'];let total=days[day][4].length*4+ids.length,done=ids.filter(x=>val(x,'done')).length;days[day][4].forEach((_,i)=>{for(let j=1;j<=4;j++)if(val('ex'+i,'done'+j))done++});let p=Math.round(done/total*100);el('bar').style.width=p+'%';el('progress').textContent=done+' / '+total+' completadas · '+p+'%'}
function render(){const d=days[day];el('days').innerHTML=days.map((x,i)=>'<button data-day="'+i+'" class="'+(i===day?'active':'')+'">'+x[0]+'</button>').join('');el('weekday').textContent=d[1].toUpperCase();el('title').textContent=d[2];el('desc').textContent=d[3];let html='';if(day===2){html+='<div class="heading"><h3>01 · Cardio</h3><small>45 min</small></div>'+cardio('middle','Cardio continuo',45)}else{html+='<div class="heading"><h3>01 · Calentamiento</h3></div>'+cardio('start','Cardio inicial',15)}html+='<div class="heading"><h3>02 · '+(day===2?'Abdomen':'Fuerza')+'</h3><small>'+d[4].length+' ejercicios</small></div>';d[4].forEach((e,i)=>html+=exercise(e,i));if(day!==2)html+='<div class="heading"><h3>03 · Cardio final</h3></div>'+cardio('end','Cardio final',10);el('workout').innerHTML=html;progress();history()}
function history(){const list=data.history.filter(x=>x.day===day).slice().reverse();el('history').innerHTML=list.length?list.map(x=>'<div class="history"><strong>'+esc(x.date)+'</strong><p>'+x.exercises.map(e=>esc(e.name)+': '+e.weights.map(w=>w===''?'—':esc(w)+' kg').join(' / ')).join('<br>')+'</p></div>').join(''):'<p>Aún no tienes sesiones registradas en este día.</p>'}
document.addEventListener('click',e=>{let d=e.target.closest('[data-day]');if(d){day=Number(d.dataset.day);render();return}let b=e.target.closest('[data-toggle]');if(b){let id=b.dataset.toggle,k=b.dataset.prop;update(id,k,!val(id,k));b.classList.toggle('on');b.textContent=val(id,k)?'✓':'○'}});
document.addEventListener('input',e=>{let f=e.target.closest('[data-id][data-k]');if(f)update(f.dataset.id,f.dataset.k,f.value)});
el('save').onclick=()=>{if(!confirm('¿Guardar esta sesión en tu historial?'))return;let exercises=days[day][4].map((e,i)=>({name:e[0],weights:[1,2,3,4].map(j=>val('ex'+i,'weight'+j)),reps:[1,2,3,4].map(j=>val('ex'+i,'reps'+j,15)),completed:[1,2,3,4].map(j=>!!val('ex'+i,'done'+j))}));data.history.push({day,date:new Date().toLocaleString('es-PE'),exercises});save();history();el('historyArea').scrollIntoView({behavior:'smooth'});alert('Sesión guardada')};
el('showHistory').onclick=()=>el('historyArea').scrollIntoView({behavior:'smooth'});
el('reset').onclick=()=>{if(confirm('¿Borrar los campos y marcas de este día? El historial se conservará.')){delete data.sessions[day];save();render()}};
el('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='respaldo-mi-rutina.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
el('import').onclick=()=>el('file').click();el('file').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;let parsed=JSON.parse(await f.text());if(!parsed||typeof parsed.sessions!=='object'||!Array.isArray(parsed.history))throw Error();if(confirm('¿Reemplazar tus registros con este respaldo?')){data=parsed;save();render()}}catch{alert('Respaldo inválido')}e.target.value=''};
el('date').textContent=new Date().toLocaleDateString('es-PE',{day:'2-digit',month:'short'});render();
</script></body></html>
